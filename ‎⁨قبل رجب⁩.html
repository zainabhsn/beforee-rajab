<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>قبل رجب</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="قبل رجب"><meta name="theme-color" content="#2f4f8f"><link rel="apple-touch-icon" id="ai" href="">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--cd:#fffdf8;--ink:#1f2a44;--mut:#6b7590;--ac:#2f4f8f;--gd:#b8924a;--ln:#d9d3c3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--cd:#1c2440;--ink:#ece8dc;--mut:#9aa3bd;--ac:#8fb0f0;--gd:#d4ae6a;--ln:#33405f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a2b;--cd:#1c2440;--ink:#ece8dc;--mut:#9aa3bd;--ac:#8fb0f0;--gd:#d4ae6a;--ln:#33405f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,"Noto Naskh Arabic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:12px 16px 100px}
h1,h2,h3,.q{font-family:Amiri,serif}h2{margin:.2em 0}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0}
.hd{text-align:center;padding:18px 6px}.hd small,small{color:var(--mut)}.hd h1{margin:0;font-size:46px;color:var(--ac)}.q{font-size:20px;color:var(--ac)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--ac));transition:width .4s}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--cd);border-radius:14px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer}.btn.o{background:none;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0}
.dc{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);font:700 18px Tajawal;cursor:pointer}.dc.s1{background:linear-gradient(to top,var(--gd) 50%,transparent 50%)}.dc.s2{background:var(--ac);color:var(--cd)}
.rv{display:flex;flex-direction:column;width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer;border:1.5px dashed var(--gd)}.rv.s2{border-style:solid}.rv b{font-family:Amiri;font-size:20px;color:var(--gd)}
.rev h2{color:var(--gd)}.rev .cd{border-color:var(--gd)}
h3{color:var(--ac);margin:14px 0 2px;border-bottom:1px solid var(--ln)}h4{margin:10px 0 0}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer;position:relative}.ck input{position:absolute;opacity:0}.ck i{width:26px;height:26px;border:1.5px solid var(--ac);border-radius:50%;flex:none;display:grid;place-items:center}.ck input:checked+i{background:var(--ac)}.ck input:checked+i:after{content:"✓";color:var(--cd);font-size:15px}
.fl{display:flex;gap:8px;align-items:center;margin:8px 0}.fl span,.fl em{flex:none;color:var(--mut);font-style:normal}.fl input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--ink);font:inherit;padding:4px 2px;border-radius:0}
.tx{display:block;margin:10px 0}.tx span{color:var(--mut)}.tx textarea{display:block;width:100%;border:1px solid var(--ln);border-radius:12px;background:none;color:var(--ink);font:inherit;padding:10px;resize:none;margin-top:4px;line-height:1.9}
.nv{display:flex;justify-content:space-between;gap:8px;margin:16px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.li a{cursor:pointer}
#tabs{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}#tabs a{cursor:pointer;flex:1;display:block;min-height:44px;line-height:28px;padding:8px 0 0;text-align:center;color:var(--mut);font-size:14px;text-decoration:none}#tabs a.on{color:var(--ac);font-weight:700}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--cd);padding:6px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.sc{overflow-x:auto}table.tk{border-collapse:collapse;min-width:700px;font-size:12px}.tk td,.tk th{padding:4px;text-align:center}.tk td:first-child{text-align:right;position:sticky;right:0;background:var(--cd);min-width:130px;font-size:13px}.tk b{display:inline-block;width:28px;height:28px;vertical-align:middle;border:1.5px solid var(--ac);border-radius:50%;cursor:pointer}.tk b.on{background:var(--ac)}
#pr{display:none}@page{margin:16mm}
@media print{#app,#tabs,#toast{display:none!important}#pr{display:block;color:#222;background:#fff;font-size:13pt;line-height:1.8}body{background:#fff}.pg{break-after:page}.pg h1{color:#2f4f8f;border-bottom:2px solid #2f4f8f}.pg h3{color:#2f4f8f;border-bottom:1px solid #aaa;break-after:avoid}.pv{min-height:3.4em;white-space:pre-wrap;border-bottom:1px solid #bbb}.pt{margin:8px 0}.pt>b{display:block;break-after:avoid}h4{break-after:avoid}}
</style></head><body><div id="app"></div><div id="pr"></div><div id="toast"></div>
<nav id="tabs"><a data-t="#home" onclick="go('home')">الرئيسية</a><a data-t="#jr" onclick="go('jr')">رحلتي في الاستعداد</a><a data-t="#bk" onclick="go('bk')">النسخ والتصدير</a></nav>
<script>
const $=i=>document.getElementById(i),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]),esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let S={},db,cur='',CR=false,NR=null,dirty=new Set(),T1,T2;
const O=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];
const c=(k,l,x)=>['c',k,l,x],f=(k,l,x)=>['f',k,l,x],t=(k,l)=>['t',k,l],g=l=>['g',l],h=l=>['l',l],p=x=>['p',x];
const NT=[g('ملاحظاتي'),t('nt','ملاحظات شخصية (اختيارية)')];
const IL=['السلام على الإمام','دعاء العهد','قراءة القرآن والتدبّر فيه','زيارة عاشوراء','الصلاة على الوقت','قضاء صلاة وصيام','قراءة كتب','الرياضة','تسبيحة الزهراء والاستغفار','محاسبة النفس','صلاة الليل قدر الاستطاعة'];
const TR=['السلام على الإمام','دعاء العهد','قراءة القرآن والتدبّر','زيارة عاشوراء','الصلاة على وقتها','قضاء صلاة وصيام','قراءة كتب','الرياضة','تسبيحة الزهراء والاستغفار','محاسبة النفس','صلاة الليل'];
const Q='<p class="q">«شهر رجب هو عيد الذين ينوون إصلاح قلوبهم»</p>';
const SCH={d:[f('dt','التاريخ'),g('العبادات'),c('a1','السلام على الإمام'),c('a2','دعاء العهد'),c('a3','زيارة عاشوراء'),c('a4','تسبيحة الزهراء'),c('a5','صلاة الليل','قدر الاستطاعة'),c('a6','الاستغفار'),f('a6n','','مرة'),h('الصلاة على وقتها'),c('p1','الصبح'),c('p2','الظهر'),c('p3','العصر'),c('p4','المغرب'),c('p5','العشاء'),h('القضاء'),f('q','صلاة'),c('s','صيام يوم'),g('القرآن والتدبّر'),h('التلاوة'),f('r1','من صفحة'),f('r2','إلى صفحة'),t('ay','آيةٌ استوقفتني'),t('tk','ماذا أخذتُ منها؟'),g('القراءة والرياضة'),c('bk','قراءة كتب'),f('bn','الكتاب'),f('bp','الصفحات'),c('sp','الرياضة'),f('st','النوع'),f('sd','المدة','دقيقة'),g('محاسبة النفس'),t('m1','ما أحسنتُ فيه اليوم'),t('m2','ما سأُصلحه غداً'),...NT],
mid:[t('m1','أين تقدّمتُ؟'),t('m2','ما العمل الذي تعثّرتُ فيه، ولماذا؟'),t('m3','ماذا سأغيّر في الأيام القادمة؟'),h('ما قضيتُه حتى الآن'),f('cp','صلاة'),f('cs','صيام'),...NT],
fin:[t('k1','الكتب التي قرأتُها'),t('k2','أكثر عمل ثبتُّ عليه'),t('k3','ما الذي تغيّر في قلبي؟'),t('k4','نيّتي لرجب'),h('مجموع القضاء'),f('cp','صلاة'),f('cs','صيام'),p(Q),...NT],
int:[f('nm','الاسم'),f('st','بدأتُ في'),t('it','نيّتي قبل رجب'),g('أعمالي اليومية'),p(IL.map((x,i)=>`<div>${ar(i+1)}. ${x}</div>`).join(''))]};
const ORDER=[...Array(15)].map((_,i)=>'d'+(i+1)).concat('mid',[...Array(15)].map((_,i)=>'d'+(i+16)),'fin'),STL=['لم يبدأ','قيد الإنجاز','مكتمل'];
const valid=id=>/^d([1-9]|[12]\d|30)$/.test(id)||['mid','fin','int'].includes(id);
function info(id){if(id[0]=='d'){const n=+id.slice(1);return{n,k:'d',t:'اليوم '+O[n-1],s:n==30?'غداً يهلّ رجب':n==29?'يبقى على رجب يومٌ واحد':n==28?'يبقى على رجب يومان':'يبقى على رجب '+ar(30-n)+(n<20?' يوماً':' أيام')}}
return{mid:{k:'mid',t:'وقفة منتصف الطريق',s:'بعد خمسة عشر يوماً'},fin:{k:'fin',t:'على أعتاب رجب',s:'حصاد ثلاثين يوماً'},int:{k:'int',t:'نيّتي قبل رجب',s:''}}[id]}
function stat(id){const sc=SCH[info(id).k],r=S[id]||{},cs=sc.filter(x=>x[0]=='c'),ts=sc.filter(x=>x[0]=='t'&&x[1]!='nt'),any=sc.some(x=>'cft'.includes(x[0])&&r[x[1]]);let n,m,d;
if(cs.length){m=cs.length;n=cs.filter(x=>r[x[1]]).length}else{m=ts.length||1;n=ts.filter(x=>(r[x[1]]||'').trim()).length}d=n==m;return{st:d?2:any?1:0,p:n/m}}
const DB=()=>new Promise((a,b)=>{const r=indexedDB.open('rajab1448',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
async function load(){db=await DB();return new Promise(a=>{const o={},q=db.transaction('kv').objectStore('kv').openCursor();q.onsuccess=e=>{const k=e.target.result;if(k){o[k.key]=k.value;k.continue()}else a(o)};q.onerror=()=>a(o)})}
const put=id=>new Promise(a=>{try{localStorage.setItem('rj:'+id,JSON.stringify(S[id]))}catch(e){}if(!db)return a();const t=db.transaction('kv','readwrite');t.objectStore('kv').put(S[id],id);t.oncomplete=a;t.onerror=()=>{toast('تعذّر الحفظ!');a()}});
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(T2);T2=setTimeout(()=>e.classList.remove('on'),1400)}
async function flush(){const ids=[...dirty];dirty.clear();if(!ids.length)return;await Promise.all(ids.map(put));if(ids.some(i=>i!='meta'))toast('✓ تم الحفظ')}
const sched=()=>{clearTimeout(T1);T1=setTimeout(flush,350)};
function set(id,k,v){(S[id]=S[id]||{})[k]=v;dirty.add(id);sched();upd()}
function upd(){const e=$('pc');if(e&&cur&&cur!='int'&&cur!='trk')e.textContent=ar(Math.round(stat(cur).p*100))+'٪ من أنشطة هذا القسم'}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>document.hidden&&flush());
function F(id,ro){const r=S[id]||{},d=ro?' disabled':'';let o='';for(const[y,k,l,x]of SCH[info(id).k]){
if(y=='g')o+=`<h3>${k}</h3>`;else if(y=='l')o+=`<h4>${k}</h4>`;else if(y=='p')o+=k;
else if(y=='c')o+=`<label class="ck"><input type="checkbox" data-k="${k}"${r[k]?' checked':''}${d}><i></i><span>${l}${x?` <small>${x}</small>`:''}</span></label>`;
else if(y=='f')o+=`<label class="fl">${l?`<span>${l}</span>`:''}<input data-k="${k}" value="${esc(r[k])}"${ro?' readonly':''}><em>${x||''}</em></label>`;
else o+=`<label class="tx"><span>${l}</span><textarea data-k="${k}" rows="3"${ro?' readonly':''}>${esc(r[k])}</textarea></label>`}return o}
function P(id){const i=info(id),r=S[id]||{};let o=`<section class="pg"><h1>${i.t}</h1><p>${i.s}</p>`;for(const[y,k,l,x]of SCH[i.k]){
if(y=='g')o+=`<h3>${k}</h3>`;else if(y=='l')o+=`<h4>${k}</h4>`;else if(y=='p')o+=k;
else if(y=='c')o+=`<div>${r[k]?'☑':'☐'} ${l}${x?' ('+x+')':''}</div>`;
else if(y=='f')o+=`<div>${l?l+': ':''}<b>${esc(r[k])||'……'}</b> ${x||''}</div>`;
else o+=`<div class="pt"><b>${l}</b><div class="pv">${esc(r[k])}</div></div>`}return o+'</section>'}
function pr(html,title){$('pr').innerHTML=html;document.title=title;setTimeout(()=>{print();document.title='قبل رجب'},200)}
const exs=id=>pr(P(id||cur),info(id||cur).t+' - قبل رجب');
const exa=()=>pr(`<section class="pg" style="text-align:center"><h1 style="font-size:46pt">قبل رجب</h1><p>مخطّط ثلاثين يوماً</p>${Q}<p>١٤٤٨ هـ</p></section>`+P('int')+ORDER.map(P).join(''),'رحلتي في الاستعداد - قبل رجب');
let RT='';const go=(id,ro)=>{NR=!!ro;RT=id;try{if(location.hash!='#'+id)location.hash=id}catch(e){}render()};
function home(){const ds=[...Array(30)].map((_,i)=>stat('d'+(i+1))),avg=(ds.reduce((a,x)=>a+x.p,0)+stat('mid').p+stat('fin').p)/32,dn=ds.filter(x=>x.st==2).length,cell=n=>`<button class="dc s${ds[n-1].st}" onclick="go('d${n}')">${ar(n)}</button>`,
R=id=>`<button class="cd rv" onclick="go('${id}')"><b>${info(id).t}</b><small>${info(id).s} · ${STL[stat(id).st]}</small></button>`,L=S.meta&&S.meta.last||'d1',rg=(a,b)=>[...Array(15)].map((_,i)=>cell(a+i)).join('');
return `<div class="hd"><small>مخطّط ثلاثين يوماً</small><h1>قبل رجب</h1>${Q}<small>١٤٤٨ هـ</small><p>أهلاً بك في رحلتك. ابدأ من حيث أنت؛ وكل ما تكتبه يُحفظ تلقائياً على جهازك.</p></div>
<div class="cd"><div class="li" style="border:0;padding:0"><b>تقدّم الرحلة</b><b>${ar(Math.round(avg*100))}٪</b></div><div class="bar"><i style="width:${avg*100}%"></i></div><small>أتممتَ ${ar(dn)} من ٣٠ يوماً · المراجعتان: ${ar(['mid','fin'].filter(i=>stat(i).st==2).length)} من ٢ (لا تُحسبان أياماً)</small><p><button class="btn" onclick="go('${L}')">تابع من ${info(L).t}</button></p></div>
<h3>الأيام ١ – ١٥</h3><div class="g">${rg(1)}</div>${R('mid')}<h3>الأيام ١٦ – ٣٠</h3><div class="g">${rg(16)}</div>${R('fin')}<h3>صفحات إضافية من المخطّط</h3>
<button class="cd rv" style="border-style:solid;border-color:var(--ln)" onclick="go('int')"><b style="color:var(--ac)">نيّتي قبل رجب</b></button><button class="cd rv" style="border-style:solid;border-color:var(--ln)" onclick="go('trk')"><b style="color:var(--ac)">متابعة الأعمال</b></button>`}
function sec(id,ro){const i=info(id),x=ORDER.indexOf(id),rv=i.k=='mid'||i.k=='fin',a=ORDER[x-1],b=ORDER[x+1];
return `<div class="${rv?'rev':''}"><a onclick="go('home')" style="color:var(--ac);cursor:pointer">→ الرئيسية</a><div class="cd" style="text-align:center"><h2>${i.t}</h2><small>${i.s}</small><br><small id="pc"></small></div>
<div class="row"><button class="btn o" onclick="CR=!CR;render(true)">${ro?'✎ وضع التعديل':'👁 وضع القراءة'}</button><button class="btn o" onclick="exs()">تصدير PDF</button></div>
<div class="cd" data-sid="${id}">${F(id,ro)}</div>${x>=0?`<div class="nv">${a?`<button class="btn o" onclick="go('${a}',${ro})">→ ${info(a).t}</button>`:'<i></i>'}${b?`<button class="btn o" onclick="go('${b}',${ro})">${info(b).t} ←</button>`:'<i></i>'}</div>`:''}</div>`}
function trk(){const tb=(a)=>`<div class="sc cd"><table class="tk"><tr><th></th>${[...Array(15)].map((_,i)=>`<th>${ar(a+i)}</th>`).join('')}</tr>${TR.map((n,r)=>`<tr><td>${n}</td>${[...Array(15)].map((_,i)=>`<td><b class="${(S.trk||{})[r+'_'+(a+i)]?'on':''}" onclick="tg(this,${r},${a+i})"></b></td>`).join('')}</tr>`).join('')}</table></div>`;
return `<a onclick="go('home')" style="color:var(--ac);cursor:pointer">→ الرئيسية</a><div class="hd"><h1 style="font-size:34px">متابعة الأعمال</h1></div><h3>الأيام ١ – ١٥</h3>${tb(1)}<h3>الأيام ١٦ – ٣٠</h3>${tb(16)}<p style="text-align:center"><small>لوّن الدائرة عند الإنجاز، واتركها إن فاتك العمل... ثم ابدأ من جديد.</small></p>`}
const tg=(e,r,d)=>{const k=r+'_'+d,v=!(S.trk||{})[k];set('trk',k,v);e.classList.toggle('on',v)};
function jr(){return `<div class="hd"><h1 style="font-size:36px">رحلتي في الاستعداد</h1><small>تصفّح كل الأيام والمراجعتين. «قراءة» تفتح القسم دون خطر التعديل.</small></div><div class="row"><button class="btn" onclick="exa()">تصدير الرحلة كاملة PDF</button></div><div class="cd">${['int',...ORDER].map(id=>{const i=info(id),s=stat(id);return `<div class="li"><div><b>${i.t}</b><br><small>${id=='int'?'':STL[s.st]+' · '+ar(Math.round(s.p*100))+'٪'}</small></div><div class="row" style="margin:0"><a class="btn o" onclick="go('${id}',true)">قراءة</a><a class="btn o" onclick="go('${id}')">✎</a><a class="btn o" onclick="exs('${id}')">PDF</a></div></div>`}).join('')}</div>`}
function bk(){return `<div class="hd"><h1 style="font-size:36px">النسخ والتصدير</h1></div><div class="cd"><h3>نسخة احتياطية</h3><p><small>تُحفظ بياناتك على هذا الجهاز فقط. احتفظ بنسخة احتياطية قبل تغيير الجهاز أو مسح بيانات المتصفح.</small></p><div class="row"><button class="btn" onclick="share()">حفظ/مشاركة الملف</button><button class="btn o" onclick="copyb()">نسخ النص</button></div>
<h3>استعادة</h3><div class="row"><input type="file" id="bf" accept=".json,application/json" onchange="rf(this)"></div><textarea id="bx" rows="3" placeholder="أو الصق النسخة هنا" style="width:100%;font:inherit;background:none;color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:8px"></textarea><p><button class="btn o" onclick="restore($('bx').value)">استعادة من النص</button></p>
<h3>تصدير PDF</h3><p><small>يُفتح مربع الطباعة: اختر «حفظ كـ PDF» أو شارك → حفظ في الملفات.</small></p><button class="btn" onclick="exa()">تصدير الرحلة كاملة</button>
